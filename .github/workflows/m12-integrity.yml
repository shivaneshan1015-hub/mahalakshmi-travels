name: M12/M13 Integrity & Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: M12/M13 CI Integrity & Migration Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integrity Validator
        run: npm run integrity

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Next.js Linter
        run: npx next lint

      - name: Run Next.js Production Build
        run: npm run build

      - name: Run M13 HTTP Redirect Smoke Test
        run: npm run m13:redirect-smoke

      - name: Run M14 Cross-System Validation
        run: npm run m14:validate

      - name: Run M15 Hardening Validation
        run: npm run m15:validate

      - name: Log CI Suite Completion
        if: success()
        run: |
          echo "CI Pipeline executed all steps successfully: install -> integrity -> tsc -> lint -> build -> m13:redirect-smoke -> m14:validate -> m15:validate."


