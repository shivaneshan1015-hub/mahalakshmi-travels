name: M12/M13 Integrity & Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: M12/M13 CI Integrity & Migration Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integrity Validator
        run: npm run integrity

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Next.js Linter
        run: npx next lint

      - name: Run Next.js Production Build
        run: npm run build

      - name: Run M13 HTTP Redirect Smoke Test
        run: npm run m13:redirect-smoke

      - name: Report M13 CI Acceptance Summary
        if: success()
        run: |
          echo "========================================="
          echo "M13 ACCEPTANCE VALIDATION"
          echo "========================================="
          echo "Migration Matrix: PASS"
          echo "Internal Links: PASS"
          echo "Redirect Configuration: PASS"
          echo "Redirect Runtime Test: PASS"
          echo "39 Tours: PASS"
          echo "Destination Noindex: PASS"
          echo "M11 Protection: PASS"
          echo "M12 Protection: PASS"
          echo "TypeScript: PASS"
          echo "Lint: PASS"
          echo "Build: PASS"
          echo "========================================="
          echo "M13 CI RESULT: PASS"
          echo "========================================="
