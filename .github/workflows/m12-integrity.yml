name: M12 Integrity & Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: M12 CI Integrity Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run M12 Integrity Validator
        run: npm run integrity

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Next.js Linter
        run: npx next lint

      - name: Run Next.js Production Build
        run: npm run build
